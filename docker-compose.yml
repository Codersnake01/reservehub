services:
  web:
    build: .
    container_name: reservehub-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres@db:5432/reservehub
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: reservehub-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservehub
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reservehub-redis
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: reservehub-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres@db:5432/reservehub
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret
    depends_on:
      - db
      - redis

volumes:
  postgres_data: